[paths]
dataset_dir = "dataset"
raw_corpus_dir = "dataset/3gpp/marked/Rel-18"
metadata_dir = "dataset/3gpp/Metadata/Rel-18"
chunk_dir = "dataset/3gpp/Chunk/Rel-18"
reference_dir = "dataset/3gpp/Reference/Rel-18"
embedding_dir = "dataset/3gpp/Embeddings/Rel-18"

[corpus]
release = "18"

[gsma]
repository = "GSMA/3GPP"
revision = "a056f6018a7e8e67052aa68a702e272d0ae95d75"
raw_markdown_glob = "marked/Rel-18/**/raw.md"
expected_raw_markdown_files = 1345

[paper]
repository = "netop/Embeddings3GPP-R18"
revision = "b8d598e50cada8aaa4de641abbec77bef6b51839"
expected_document_files = 553
paper_selection_id = "paper-baseline-gsma-rel18"
full_selection_id = "full-gsma-rel18"

[paper_release_summaries]
source_dir = "dataset/3gpp/paper_release_summaries/source/Documents"
chunk_file = "ChunkReleaseSummaries.json"
source_releases = ["14", "15", "16", "17"]

[teleqna]
repository = "netop/TeleQnA"
revision = "0eba715a43f0ab7e4d9d7e09ceb258642a149391"
include_file = "TeleQnA.json"
release_tag_pattern = "[3GPP Release \\d+]"

[chunking]
preferred_source_name = "raw.md"
fallback_source_name = "raw.md"

# Approximate character-based chunk limits. 250/300 is the original paper
# profile: target 250 tokens, but finish a sentence up to 300. Changing any
# chunking value requires rechunking, re-embedding, rebuilding BM25, and
# rebuilding hierarchy anchors for the affected profile.
target_tokens = 250
max_tokens = 300
characters_per_token = 4

[embedding]
# Changing backend/model/dimensions creates an incompatible vector profile:
# re-embed chunks, rebuild the lexical index, and rebuild hierarchy anchors.
# paper_nn routing specifically requires text-embedding-3-large at 1024 dims.
backend = "openai"
model = "text-embedding-3-large"
dimensions = 1024
normalize = false
batch_size = 128
max_retries = 6

[llm]
# Runtime-only answer/rephrase settings; they do not change stored vectors.
# temperature=0 is recommended for benchmark stability, though providers can
# still be non-deterministic. GPT-5.6 only accepts its default temperature=1;
# the client omits this setting automatically for that model family.
# Supported providers: openai, deepseek, openrouter.
provider = "openrouter"
api_key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"


thinking_mode = "disabled"
temperature = 0

#provider = "deepseek"
#api_key_env = "DEEPSEEK_API_KEY"
#base_url = "https://api.deepseek.com"
#thinking_mode = "disabled"

[rag]
resources_dir = "MuCiRAG/resources"
router_checkpoint = "router_new.pth"
series_descriptions = "series_description.json"
vocabulary = "3GPP_vocabulary.docx"
selection_id = "paper-baseline-gsma-rel18"

# Models used at query time only: rephrase affects retrieval; answer affects
# final option choice. Keep both fixed when comparing benchmark runs.
rephrase_model = "mistralai/mistral-large-2512"
answer_model = "mistralai/mistral-large-2512"

# rephrase_model = "gpt-3.5-turbo"
# answer_model = "gpt-3.5-turbo"
# router_top_k is used only with anchor_strategy="router" (number of routed
# series). retrieval_top_k is the number of original seed chunks: 8 currently.
router_top_k = 5
retrieval_top_k = 8
# semantic = dense vectors only; hybrid = dense + BM25 reciprocal-rank fusion.
# hybrid requires lexical_index_file built for this exact embedding profile.
retrieval_backend = "hybrid"
lexical_index_file = "lexical.sqlite3"
# Used by hybrid seed retrieval and rrf_bfs citation selection. Weights must
# be non-negative and sum to 1.0; 0.5/0.5 preserves equal-rank fusion.
rrf_dense_weight = 0.3
rrf_bm25_weight = 0.7
router_similarity_scale = 10.0
# paper_nn requires OpenAI text-embedding-3-large/1024; semantic is the
# alternative router backend when another embedding model is used.
router_backend = "paper_nn"

# hierarchical ranks all chunks using weighted series/document/chunk anchors;
# router uses router_top_k series then ordinary retrieval. Anchor weights are
# used only by hierarchical and must be non-negative and sum exactly to 1.0.
anchor_strategy = "hierarchical"
#anchor_strategy = "router"

anchor_series_weight = 0.1
anchor_document_weight = 0.1
anchor_chunk_weight = 0.8
anchor_hierarchy_descriptions_file = "anchor_hierarchy.descriptions.jsonl"
anchor_hierarchy_vectors_file = "anchor_hierarchy.vectors.npz"
anchor_hierarchy_manifest_file = "anchor_hierarchy.manifest.json"
# Deliberately separate from the active chunk-vector profile: these frozen
# document/series summaries are reused without re-embedding them.
anchor_hierarchy_embedding_root = "dataset/3gpp/Embeddings/Rel-18/paper-baseline-gsma-rel18"
# Citation expansion runs after the 8 seed chunks. semantic_bfs reproduces the
# query-similarity BFS behavior; rrf_bfs fuses dense and BM25 ranks only among
# each BFS frontier target set; gain first extracts answer facets and admits
# only citations that add enough facet coverage (citation_min_gain applies only
# to gain). Keep one value uncommented: semantic_bfs, rrf_bfs, or gain.

#citation_strategy = "gain"
citation_strategy = "rrf_bfs"
#citation_strategy = "semantic_bfs"

# max_depth=0 or max_chunks=0 disables citation expansion completely.
# When both are positive, max_chunks is a per-depth cap.
# chunks_per_heading prevents multiple chunks from the same cited heading.
citation_max_depth = 1
citation_min_gain = 0.01
citation_max_chunks = 4
citation_chunks_per_heading = 4

[vocabulary]

#mode = "paper_legacy"
mode = "release18_unambiguous"
definitions_file = "3GPP_definitions_paper_v17.json"
abbreviations_file = "3GPP_vocabulary_release18.json"

[evaluation]
teleqna_output_dir = "results/teleqna"
progress_every = 10

[experiment_tracking]
# MLflow uses a local SQLite store plus local artifacts; no account or cloud upload.
# Use "disabled" to skip tracking entirely.
mode = "mlflow"
experiment_name = "telco-rag"
tracking_directory = "MuCiRAG/results/mlflow"

[runtime]
download_progress_seconds = 10
http_timeout_seconds = 90
