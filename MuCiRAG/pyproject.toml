[project]
name = "mucirag"
version = "0.1.0"
description = "MuCiRAG: hierarchical and citation-aware retrieval for telecom question answering"
requires-python = ">=3.11,<3.12"
dependencies = [
  "faiss-cpu>=1.8.0,<2.0.0",
  "huggingface-hub[cli]>=0.27.0,<2.0.0",
  "matplotlib>=3.8,<4.0",
  "mlflow>=2.17.0,<4.0.0",
  "numpy>=1.23.0",
  "openai>=1.0.0,<3.0.0",
  "python-docx>=1.1.0,<2.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "torch==2.13.0+cpu",
]

[dependency-groups]
dev = ["pytest>=8.0,<9.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
